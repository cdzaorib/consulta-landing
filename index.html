<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3327" />
    <meta
      name="description"
      content="Conclínica — sistema de gestão para clínicas e consultórios: agenda online, prontuário eletrônico com IA, faturamento TISS e financeiro em um só lugar."
    />
    <!--
      Prévia de compartilhamento. A imagem é gerada por
      `node scripts/make-og.mjs` a partir dos tokens do design system.

      ATENÇÃO ao publicar: og:image precisa de URL absoluta para o WhatsApp
      e o Facebook montarem o card. Trocar o caminho relativo abaixo pelo
      domínio final (ex.: https://seu-dominio.com/og.png).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Conclínica" />
    <meta property="og:title" content="Conclínica — sistema de gestão para clínicas e consultórios" />
    <meta
      property="og:description"
      content="Agenda online, prontuário eletrônico com IA, faturamento TISS e financeiro integrados. Feito para clínicas e consultórios."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Conclínica — a agenda, o prontuário e o caixa da sua clínica num lugar só." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Conclínica — sistema de gestão para clínicas e consultórios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
